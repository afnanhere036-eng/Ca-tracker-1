<!DOCTYPE html>
<html lang="en" data-own-styles>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Create Time Block | CA Foundation</title>
<style>
:root{color-scheme:dark;--bg:#101114;--surface:#202023;--line:#39393e;--ink:#f6f5f7;--muted:#a5a3ad;--accent:#f58b8b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}.wrap{max-width:680px;margin:auto}.top{padding:20px 0 10px}.back-row{display:flex;justify-content:space-between;align-items:center;gap:8px}.back{color:#ffaaaa;text-decoration:none;display:inline-block;margin-bottom:12px}.home-link{color:#d9d6df;text-decoration:none;display:inline-flex;align-items:center;min-height:36px;padding:0 9px;border-radius:10px;background:#ffffff0b;font-size:13px;font-weight:650}.top h1{font-size:25px;margin:0}.top p{color:var(--muted);margin:4px 0}.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px;margin:14px 0}h2{font-size:18px;margin:0 0 12px}button,input,select{font:inherit}button{border:0;border-radius:11px;padding:10px 14px;background:#303036;color:var(--ink);font-weight:650;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ffc0c0;outline-offset:2px}input[type=text],input[type=date],input[type=time],select{width:100%;min-height:44px;background:#111216;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px}.field{display:block;font-weight:650;font-size:14px;margin:12px 0 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.color-title{font-size:14px;font-weight:650;margin:14px 0 7px}.colors,.days{display:flex;gap:10px;flex-wrap:wrap}.choice{position:relative;display:inline-flex;cursor:pointer}.choice input{position:absolute;opacity:0;width:1px;height:1px}.swatch{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px #ffffff38}.choice input:checked+.swatch{outline:2px solid white;outline-offset:2px}.day-choice span{display:inline-flex;min-width:43px;min-height:40px;align-items:center;justify-content:center;padding:6px 9px;border:1px solid var(--line);border-radius:11px;color:var(--muted)}.day-choice input:checked+span{background:#493438;border-color:#f58b8b;color:white}.day-choice input:focus-visible+span{outline:2px solid #ffc0c0}.hint{font-size:13px;color:var(--muted)}.actions{display:flex;gap:8px;margin-top:16px}.primary{background:#ad5e65}.error{color:#ffaaaa;min-height:20px;font-size:14px}.block-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.block-row small{display:block;color:var(--muted)}.block-actions{display:flex;gap:6px}.block-actions button{padding:7px 9px;font-size:13px}.delete{background:#633b46;color:#ffd9df}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}body #cat-topbar{padding-left:2px;padding-right:2px}@media(max-width:480px){body #cat-topbar{padding-left:6px;padding-right:6px}body{padding-left:12px;padding-right:12px}.panel{padding:13px}.grid{gap:0 8px}.block-actions{flex-direction:column}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body><div id="cat-topbar"></div><main class="wrap">
<header class="top"><div class="back-row"><a class="back" id="back-link" href="timeblocks.html">← Back to schedule</a></div><h1 id="page-title">Create a time block</h1><p>Choose its time, color, and the dates it appears.</p></header>
<section class="panel"><form id="block-form">
<label class="field" for="block-name">What are you doing?</label><input id="block-name" type="text" maxlength="60" placeholder="e.g. Accounting revision" required>
<div class="grid"><div><label class="field" for="start-time">Start time</label><input id="start-time" type="time" value="09:00" required></div><div><label class="field" for="end-time">End time</label><input id="end-time" type="time" value="10:00" required></div></div>
<div class="color-title">Block color</div><div class="colors" id="colors" role="radiogroup" aria-label="Choose block color"></div>
<label class="field" for="repeat">Show this block</label><select id="repeat"><option value="once">On one specific date</option><option value="daily">Every day</option><option value="weekdays">On selected days of the week</option></select>
<div id="date-wrap"><label class="field" for="block-date">Date</label><input id="block-date" type="date"></div>
<div id="days-wrap" hidden><span class="field">Choose days</span><div class="days" id="days"></div></div>
<p class="hint">Your time blocks and completion marks are saved in this browser on this device.</p><div class="actions"><button class="primary" id="save-button" type="submit">Add time block</button><button type="button" id="cancel-button">Cancel</button></div><p class="error" id="error" role="alert"></p>
</form></section>
<section class="panel"><h2>Your saved blocks</h2><div id="saved-blocks"></div></section>
</main>
<script>
(function(){"use strict";var KEY="ca-checklist-timeblocks-v1",DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],PALETTE=[{id:"lavender",name:"Lavender",dot:"#a997ff"},{id:"blue",name:"Blue",dot:"#6eb6ff"},{id:"teal",name:"Teal",dot:"#5dd4c1"},{id:"green",name:"Green",dot:"#a6d66e"},{id:"yellow",name:"Yellow",dot:"#f1c15f"},{id:"orange",name:"Orange",dot:"#ff9b65"},{id:"pink",name:"Pink",dot:"#ed8db9"},{id:"red",name:"Red",dot:"#ff858b"}],params=new URLSearchParams(location.search),returnDate=params.get("date"),editing=params.get("edit"),store={blocks:[],checks:{}},editingId=editing||null;
try{var s=JSON.parse(localStorage.getItem(KEY)||"{}");if(Array.isArray(s.blocks))store.blocks=s.blocks;if(s.checks&&typeof s.checks==="object")store.checks=s.checks;}catch(e){}
function el(id){return document.getElementById(id)}function localDate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function dateFrom(s){return new Date(s+"T12:00:00")}function min(s){var p=s.split(":");return +p[0]*60 + +p[1]}function color(id){return PALETTE.find(function(c){return c.id===id})||PALETTE[0]}function safe(s){var n=document.createElement("span");n.textContent=s;return n.innerHTML}function persist(){localStorage.setItem(KEY,JSON.stringify(store))}function backUrl(){return "timeblocks.html"+(returnDate?"?date="+encodeURIComponent(returnDate):"")}el("back-link").href=backUrl();el("cancel-button").addEventListener("click",function(){location.href=backUrl()});
var defaultDate=/^\d{4}-\d{2}-\d{2}$/.test(returnDate||"")?returnDate:localDate(new Date());el("block-date").value=defaultDate;
PALETTE.forEach(function(c,i){var l=document.createElement("label");l.className="choice";l.title=c.name;l.innerHTML='<input type="radio" name="color" value="'+c.id+'" aria-label="'+c.name+'" '+(i===0?"checked":"")+'><span class="swatch" style="background:'+c.dot+'"></span>';el("colors").appendChild(l)});DAYS.forEach(function(d,i){var l=document.createElement("label");l.className="choice day-choice";l.innerHTML='<input type="checkbox" value="'+i+'"><span>'+d+'</span>';el("days").appendChild(l)});
function applies(b,date){if(b.repeat==="daily")return true;if(b.repeat==="weekdays")return (b.days||[]).indexOf(dateFrom(date).getDay())!==-1;return b.date===date}function daysFor(b){return b.repeat==="daily"?[0,1,2,3,4,5,6]:b.repeat==="weekdays"?(b.days||[]):[dateFrom(b.date).getDay()]}function intersects(a,b){if(a.repeat==="once"&&b.repeat==="once")return a.date===b.date;if(a.repeat==="once")return applies(b,a.date);if(b.repeat==="once")return applies(a,b.date);return daysFor(a).some(function(d){return daysFor(b).indexOf(d)>=0})}
function showFields(){el("date-wrap").hidden=el("repeat").value!=="once";el("days-wrap").hidden=el("repeat").value!=="weekdays"}el("repeat").addEventListener("change",showFields);
function reset(){editingId=null;el("block-form").reset();el("start-time").value="09:00";el("end-time").value="10:00";el("block-date").value=defaultDate;el("page-title").textContent="Create a time block";el("save-button").textContent="Add time block";el("repeat").value="once";el("colors").querySelector('input[value="lavender"]').checked=true;el("days").querySelectorAll("input").forEach(function(x){x.checked=false});el("error").textContent="";showFields()}function edit(b){editingId=b.id;el("block-name").value=b.name;el("start-time").value=b.start;el("end-time").value=b.end;el("repeat").value=b.repeat;el("block-date").value=b.date||defaultDate;el("colors").querySelector('input[value="'+color(b.color).id+'"]').checked=true;el("days").querySelectorAll("input").forEach(function(x){x.checked=(b.days||[]).indexOf(+x.value)>=0});el("page-title").textContent="Edit time block";el("save-button").textContent="Save changes";showFields();window.scrollTo({top:0,behavior:"smooth"})}
function list(){var out=el("saved-blocks");out.innerHTML="";if(!store.blocks.length){out.textContent="No blocks created yet.";return}store.blocks.slice().sort(function(a,b){return min(a.start)-min(b.start)}).forEach(function(b){var c=color(b.color),repeat=b.repeat==="daily"?"Every day":b.repeat==="weekdays"?(b.days||[]).map(function(d){return DAYS[d]}).join(", "):"Once · "+b.date,row=document.createElement("div");row.className="block-row";row.innerHTML='<div><strong><i class="dot" style="background:'+c.dot+'"></i>'+safe(b.name)+'</strong><small>'+b.start+"–"+b.end+" · "+safe(repeat)+'</small></div><div class="block-actions"><button class="edit" type="button">Edit</button><button class="delete" type="button">Delete</button></div>';row.querySelector(".edit").addEventListener("click",function(){edit(b)});row.querySelector(".delete").addEventListener("click",function(){if(!confirm('Delete “'+b.name+'” and its completion marks?'))return;store.blocks=store.blocks.filter(function(x){return x.id!==b.id});Object.keys(store.checks).forEach(function(k){if(k.endsWith("|"+b.id))delete store.checks[k]});persist();if(editingId===b.id)reset();list()});out.appendChild(row)})}
if(editingId){var found=store.blocks.find(function(b){return b.id===editingId});if(found)edit(found);else editingId=null}showFields();list();
el("block-form").addEventListener("submit",function(e){e.preventDefault();var name=el("block-name").value.trim(),start=el("start-time").value,end=el("end-time").value,repeat=el("repeat").value,error=el("error");error.textContent="";if(!name){error.textContent="Enter a name for this block.";return}if(!start||!end||min(end)<=min(start)){error.textContent="End time must be later than start time on the same day.";return}var b={id:editingId||("tb-"+Date.now()+"-"+Math.random().toString(36).slice(2,8)),name:name,start:start,end:end,repeat:repeat,date:repeat==="once"?el("block-date").value:"",days:[],color:el("colors").querySelector("input:checked").value};if(repeat==="once"&&!b.date){error.textContent="Choose a date.";return}if(repeat==="weekdays"){b.days=Array.from(el("days").querySelectorAll("input:checked")).map(function(x){return +x.value});if(!b.days.length){error.textContent="Choose at least one weekday.";return}}var overlap=store.blocks.some(function(other){return other.id!==editingId&&intersects(b,other)&&min(b.start)<min(other.end)&&min(other.start)<min(b.end)});if(overlap){error.textContent="This time overlaps another block on one of its scheduled days.";return}if(editingId)store.blocks=store.blocks.map(function(x){return x.id===editingId?b:x});else store.blocks.push(b);try{persist()}catch(err){error.textContent="Could not save this block in browser storage.";return}location.href="timeblocks.html?date="+encodeURIComponent(repeat==="once"?b.date:(returnDate||defaultDate))});
})();
</script>
<script src="js/core.js"></script>
</body></html>
