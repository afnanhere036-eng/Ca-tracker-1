:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:3px double var(--rule);padding:10px 16px 10px}
.wrap{max-width:720px;margin:0 auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1,h2,.wk,.bal{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
h1{font-size:18px;margin:0;line-height:1.2}
.sub{margin:0;font-size:13px;color:var(--muted)}
button{font:inherit;font-size:14px;font-weight:600;color:var(--on-accent);background:var(--accent);border:0;border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ledger{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-variant-numeric:tabular-nums}
.bal{font-size:22px;font-weight:700}.of{font-size:14px;font-weight:400;color:var(--muted)}
.left{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--done);transition:width .2s}
main{max-width:720px;margin:0 auto;padding:16px 12px 24px}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--pc,var(--accent));border-radius:8px;margin:0 0 10px}
.card>h2{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;margin:0;padding:12px 14px 4px}
summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
summary::-webkit-details-marker{display:none}
.wk{font-size:17px;font-weight:600}.range{font-size:13px;color:var(--muted);margin-left:8px}
.cnt{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.card.done .cnt{color:var(--done);font-weight:600}
[data-p="1"]{--pc:var(--p1)}[data-p="2"]{--pc:var(--p2)}[data-p="3"]{--pc:var(--p3)}[data-p="4"]{--pc:var(--p4)}
.day{padding:8px 14px 4px;border-top:1px solid var(--line);scroll-margin-top:128px}
.day.today{background:var(--today)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline}
.date{font-weight:600}.tag{font-size:12px;font-weight:600;color:var(--accent);margin-left:8px}
.day.done .cnt{color:var(--done);font-weight:600}
ul{list-style:none;margin:0;padding:0}
.task{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;padding:7px 0;cursor:pointer}
.task input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.subj{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.what{display:block;font-size:15px}
input:checked+.txt .what{color:var(--muted);text-decoration:line-through}
footer{max-width:720px;margin:0 auto;padding:0 16px 32px;font-size:13px;color:var(--muted)}

function fmt(s){var d=parse(s);return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()];}
function ymd(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x;}
function item(id,label,text){return '<li><label class="task"><input type="checkbox" data-id="'+id+'"'+(store[id]?' checked':'')+'><span class="txt">'+(label?'<span class="subj">'+esc(label)+'</span>':'')+'<span class="what">'+esc(text)+'</span></span></label></li>';}
var W=[],wi={};
D.forEach(function(d){if(!(d.w in wi)){wi[d.w]=W.length;W.push({w:d.w,p:d.pn,name:d.p,days:[]});}W[wi[d.w]].days.push(d);});
function range(a,b){var x=parse(a),y=parse(b);return x.getMonth()===y.getMonth()?x.getDate()+"–"+y.getDate()+" "+MON[y.getMonth()]:x.getDate()+" "+MON[x.getMonth()]+" – "+y.getDate()+" "+MON[y.getMonth()];}
var today=ymd(new Date()),cur=null;
D.forEach(function(d){if(d.d===today)cur=d;});
var h='<section class="card" id="setup"><h2>Before you start <span class="cnt" id="cnt-setup"></span></h2><ul style="padding:0 14px 6px">';
SETUP.forEach(function(t,i){h+=item("s"+i,"",t);});
h+='</ul></section>';
W.forEach(function(wk){
 var open=cur?cur.w===wk.w:wk.w===1;
 h+='<details class="card" data-p="'+wk.p+'" id="week-'+wk.w+'"'+(open?' open':'')+'><summary><span><span class="wk">Week '+wk.w+'</span><span class="range">'+range(wk.days[0].d,wk.days[wk.days.length-1].d)+' · '+wk.name+'</span></span><span class="cnt" id="cnt-wk-'+wk.w+'"></span></summary>';
 wk.days.forEach(function(d){
  h+='<article class="day'+(cur&&cur.n===d.n?' today':'')+'" id="day-'+d.n+'"><div class="dayhead"><span><span class="date">'+fmt(d.d)+'</span>'+(cur&&cur.n===d.n?'<span class="tag">Today</span>':'')+'</span><span class="cnt" id="cnt-day-'+d.n+'"></span></div><ul>';
  d.b.forEach(function(b){h+=item("d"+d.n+"b"+b[0],b[1],b[2]);});
  h+='</ul></article>';
 });
 h+='</details>';
});
document.getElementById("main").innerHTML=h;
function set(id,t){document.getElementById(id).textContent=t;}
function refresh(){
 var done=0,sd=0;
 SETUP.forEach(function(_,i){if(store["s"+i])sd++;});
 set("cnt-setup",sd+"/"+SETUP.length);
 document.getElementById("setup").classList.toggle("done",sd===SETUP.length);
 W.forEach(function(wk){
  var wd=0;
  wk.days.forEach(function(d){
   var c=0;d.b.forEach(function(b){if(store["d"+d.n+"b"+b[0]])c++;});
   var full=c===d.b.length;if(full){wd++;done++;}
   document.getElementById("day-"+d.n).classList.toggle("done",full);
   set("cnt-day-"+d.n,full?"Done":c+"/"+d.b.length);
  });
  set("cnt-wk-"+wk.w,wd+"/"+wk.days.length);
  document.getElementById("week-"+wk.w).classList.toggle("done",wd===wk.days.length);
 });
 set("done-n",done);
 document.getElementById("fill").style.width=(done/D.length*100)+"%";
 document.getElementById("bar").setAttribute("aria-valuenow",done);
}
var left=Math.round((new Date(2027,4,3)-parse(today))/864e5);
set("left",left>0?left+" days to 3 May 2027":"Exam period");
document.addEventListener("change",function(e){var id=e.target&&e.target.getAttribute&&e.target.getAttribute("data-id");if(!id)return;if(e.target.checked)store[id]=1;else delete store[id];save();refresh();});
document.getElementById("goto").addEventListener("click",function(){
 var t=cur;if(!t){D.forEach(function(d){if(!t&&d.b.some(function(b){return !store["d"+d.n+"b"+b[0]];}))t=d;});}
 if(!t)t=D[D.length-1];
 document.getElementById("week-"+t.w).open=true;
 var calm=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
 document.getElementById("day-"+t.n).scrollIntoView({block:"start",behavior:calm?"auto":"smooth"});
});
refresh();
})();
</script>
<script>
// Saves the whole app on this device the first time it is opened online, so it works offline afterwards.
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener("load",function(){try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}});}
</script>
