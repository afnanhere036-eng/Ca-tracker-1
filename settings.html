<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A2029">
<title>Settings | CA Foundation</title>
</head><body>
<div id="cat-topbar"></div>
<main class="wrap">
  <h1>Settings</h1>
  <p class="sub">Your profile, app usage and device details.</p>
  <h2>Profile</h2><div class="panel" id="profile-card"></div>
  <h2>Usage</h2><div class="panel" id="usage-card"></div>
  <h2>About</h2><div class="panel" id="about-card"></div>
</main>

<script src="js/core.js"></script>
<script>
(function () {
  var el = CAT.el;
  function row(key, value, extra) {
    var v = el("span", { class: "v" }, [el("span", { text: value })]);
    if (extra) v.append(extra);
    return el("div", { class: "kv" }, [el("span", { class: "k", text: key }), v]);
  }
  function render(p) {
    var pc = document.getElementById("profile-card"), uc = document.getElementById("usage-card"), ac = document.getElementById("about-card");
    pc.replaceChildren(); uc.replaceChildren(); ac.replaceChildren();
    if (!p) return;
    pc.append(row("Username", p.name, el("button", { class: "btn ghost small", text: "Edit", onclick: CAT.renameActive })));
    pc.append(row("Profiles on this device", String(CAT.profiles.all().length), el("button", { class: "btn ghost small", text: "Add", onclick: CAT.addProfile })));
    uc.append(row("Time in app", CAT.formatDuration(p.usageSec)));
    uc.append(row("Using since", new Date(p.created).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" })));
    uc.append(row("Days using the app", String(Math.max(1, Math.ceil((Date.now() - p.created) / 86400000)))));
    var d = CAT.deviceInfo();
    ac.append(row("App name", CAT.app.name));
    ac.append(row("Version", CAT.app.version));
    ac.append(row("Device", d.name));
    ac.append(row("Browser", d.browser));
  }
  CAT.onChange(render);
  setInterval(function () { render(CAT.profiles.active()); }, 10000);
})();
</script>
</body></html>
