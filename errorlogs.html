<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A2029">
<title>Error Logs | CA Foundation</title>
<style>
:root{color-scheme:dark;--bg:#1A2029;--card:#232c38;--card2:#2b3644;--text:#e9f4fb;--muted:#9fb3c4;--ice:#7fd4ff;--line:rgba(127,212,255,.16);--p1:#6B9BF0;--p2:#E8A24A;--p3:#EE6B7B;--p4:#5CC593;--danger:#ff7d8c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#2a3646 0%,var(--bg) 55%);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(18px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:24px;letter-spacing:.2px}
.home{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:12px;background:#ffffff12;color:#dbe9f4;text-decoration:none;font-size:13px;font-weight:650;white-space:nowrap}
.lead{margin:6px 0 14px;color:var(--muted);font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{padding:10px 8px;text-align:center;border-radius:14px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line)}
.stat b{display:block;font-size:20px}.stat span{font-size:11.5px;color:var(--muted)}
.tools{display:flex;gap:8px;margin-bottom:14px;position:sticky;top:max(6px,env(safe-area-inset-top));z-index:5}
.tools input{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#141a22;color:var(--text);font:inherit;outline:none}
.tools input:focus{border-color:var(--ice)}
.tools button{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:inherit;font-size:13px;font-weight:650;cursor:pointer}
.warn{display:none;margin:0 0 12px;padding:10px 12px;border-radius:12px;background:#ff7d8c1a;color:#ffc2ca;font-size:12.5px}
.paper{margin:0 0 12px;border-radius:18px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-left:5px solid var(--pc);overflow:hidden}
.paper>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.paper>summary::-webkit-details-marker{display:none}
.num{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#10161f;background:var(--pc)}
.ptitle{flex:1;min-width:0}.ptitle b{display:block;font-size:16.5px;line-height:1.25}.ptitle span{font-size:12.5px;color:var(--muted)}
.pcount{font-weight:750;font-size:13px;color:var(--pc);white-space:nowrap}
.chev{color:var(--muted);transition:transform .2s}
details[open]>summary .chev{transform:rotate(90deg)}
.pbody{padding:0 12px 12px}
.part{margin:10px 2px 6px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--pc);font-weight:750}
.ch{margin:0 0 8px;border-radius:12px;background:#141a22;border:1px solid rgba(255,255,255,.06)}
.ch>summary{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:11px 12px;cursor:pointer}
.ch>summary::-webkit-details-marker{display:none}
.cn{flex:0 0 auto;min-width:26px;color:var(--pc);font-weight:800;font-variant-numeric:tabular-nums}
.ct{flex:1;min-width:0;font-weight:620;line-height:1.35}
.badge{flex:0 0 auto;font-size:11.5px;color:var(--muted);padding:2px 8px;border-radius:99px;background:#ffffff10;white-space:nowrap}
.badge.has{background:#ff7d8c26;color:#ffc2ca}
.cbody{padding:0 12px 12px}
textarea{width:100%;min-height:78px;resize:vertical;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#10151c;color:var(--text);font:inherit;font-size:14px;outline:none}
textarea:focus{border-color:var(--ice)}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:inherit;font-size:13px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:#2f4a63;border-color:rgba(127,212,255,.4)}
.btn:active{transform:scale(.98)}
input[type=file]{display:none}
.items{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.item{padding:10px 12px;border-radius:12px;background:#ffffff0a;border:1px solid rgba(255,255,255,.06)}
.item .meta{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.item .txt{white-space:pre-wrap;word-break:break-word;font-size:14px}
.item .del{background:none;border:0;color:var(--danger);font:inherit;font-size:12px;font-weight:650;cursor:pointer;padding:4px 2px}
.file{display:flex;gap:10px;align-items:center}
.file img{width:52px;height:52px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:#10151c}
.file .ficon{width:52px;height:52px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;background:#10151c;font-size:22px}
.file .fi{flex:1;min-width:0}
.file .fi a{color:var(--ice);word-break:break-all;font-size:14px;text-decoration:none}
.sec{margin:14px 0 0;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:750}
.none{color:var(--muted);font-size:12.5px;margin-top:10px}
.empty{display:none;text-align:center;color:var(--muted);padding:26px 0}
mark{background:#7fd4ff33;color:inherit;border-radius:3px}
@media(max-width:380px){h1{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <div id="cat-topbar"></div>
  <div class="top"><h1>Error Logs</h1></div>
  <p class="lead">Open a chapter to note the mistakes you made and attach photos or files of them.</p>
  <div class="stats">
    <div class="stat"><b id="sChapters">0</b><span>Chapters</span></div>
    <div class="stat"><b id="sNotes">0</b><span>Statements</span></div>
    <div class="stat"><b id="sFiles">0</b><span>Files</span></div>
  </div>
  <div class="warn" id="warn">File attachments can't be kept in this browser (private mode?). Statements are still saved to your account.</div>
  <div class="tools">
    <input id="q" type="search" placeholder="Search chapters" aria-label="Search chapters" autocomplete="off">
    <button id="toggle" type="button">Expand all</button>
  </div>
  <div id="list"></div>
  <div class="empty" id="empty">No chapters match your search.</div>
</div>

<script>
(function(){
  "use strict";
  // Chapter names per paper (same as syllabus.html). Parts only group Quantitative Aptitude.
  var PAPERS=[
    {n:1,name:"Accounting",color:"var(--p1)",parts:[{title:"",chapters:["Theoretical Framework","Accounting Process","Bank Reconciliation Statement","Inventories","Depreciation and Amortisation","Bills of Exchange and Promissory Notes","Final Accounts of Sole Proprietors","Financial Statements of Not-for-Profit Organisations","Accounts from Incomplete Records","Partnership and LLP Accounts","Company Accounts"]}]},
    {n:2,name:"Business Laws",color:"var(--p2)",parts:[{title:"",chapters:["Indian Regulatory Framework","The Indian Contract Act, 1872","The Sale of Goods Act, 1930","The Indian Partnership Act, 1932","The Limited Liability Partnership Act, 2008","The Companies Act, 2013","The Negotiable Instruments Act, 1881"]}]},
    {n:3,name:"Quantitative Aptitude",color:"var(--p3)",parts:[
      {title:"Part A · Business Mathematics",chapters:["Ratio and Proportion, Indices, Logarithms","Equations","Linear Inequalities","Mathematics of Finance","Basic Concepts of Permutations and Combinations","Sequence and Series (AP and GP)","Sets, Relations and Functions; Limits and Continuity (basics)","Basic Applications of Differential and Integral Calculus"]},
      {title:"Part B · Logical Reasoning",chapters:["Number Series, Coding and Decoding, Odd Man Out","Direction Tests","Seating Arrangements","Blood Relations"]},
      {title:"Part C · Statistics",chapters:["Statistical Representation of Data; Sampling","Measures of Central Tendency and Dispersion","Probability","Theoretical Distributions","Correlation and Regression","Index Numbers"]}]},
    {n:4,name:"Business Economics",color:"var(--p4)",parts:[{title:"",chapters:["Nature and Scope of Business Economics","Theory of Demand and Supply","Theory of Production and Cost","Price Determination in Different Markets","Business Cycles","Determination of National Income","Public Finance","Money Market","International Trade","Indian Economy"]}]}
  ];

  // Flat chapter list with stable ids (paper number + position)
  var CHAPTERS=[];
  PAPERS.forEach(function(p){var i=0;p.parts.forEach(function(pt){pt.chapters.forEach(function(name){i++;CHAPTERS.push({id:"p"+p.n+"c"+i,name:name});});});});

  var list=document.getElementById("list"),qEl=document.getElementById("q"),toggle=document.getElementById("toggle"),empty=document.getElementById("empty"),warn=document.getElementById("warn");
  document.getElementById("sChapters").textContent=CHAPTERS.length;

  function esc(s){var d=document.createElement("span");d.textContent=s;return d.innerHTML;}
  function hl(s,q){var t=esc(s);if(!q)return t;var re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");return t.replace(re,"<mark>$1</mark>");}
  function fmtDate(ts){try{return new Date(ts).toLocaleString([], {day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});}catch(e){return "";}}
  function fmtSize(b){return b<1024?b+" B":b<1048576?(b/1024).toFixed(0)+" KB":(b/1048576).toFixed(1)+" MB";}

  /* ---------- storage ----------
     Statements and file details are kept in localStorage (keys el:n:<id> and el:f:<id>), so js/core.js
     saves them to your account and syncs them to your other devices.
     The files themselves are cached in IndexedDB on this device and uploaded to the server. */
  var db=null,memBlobs={},NP="el:n:",FP="el:f:";
  function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
  function lsList(prefix){
    var out=[];
    try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
      if(k&&k.indexOf(prefix)===0){try{var r=JSON.parse(localStorage.getItem(k));r.id=k.slice(prefix.length);out.push(r);}catch(e){}}}}catch(e){}
    return out;
  }
  function lsSet(key,obj){localStorage.setItem(key,JSON.stringify(obj));}
  function openDb(){
    return new Promise(function(res){
      if(!window.indexedDB){res(null);return;}
      var r;try{r=indexedDB.open("ca-error-logs",2);}catch(e){res(null);return;}
      r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains("blobs"))d.createObjectStore("blobs",{keyPath:"id"});};
      r.onsuccess=function(){res(r.result);};
      r.onerror=r.onblocked=function(){res(null);};
    });
  }
  function putBlob(id,blob){
    if(!db){memBlobs[id]=blob;return Promise.resolve();}
    return new Promise(function(res,rej){var t=db.transaction("blobs","readwrite");t.objectStore("blobs").put({id:id,blob:blob});t.oncomplete=function(){res();};t.onerror=t.onabort=function(){rej(t.error);};});
  }
  function delBlob(id){
    delete memBlobs[id];
    if(!db)return Promise.resolve();
    return new Promise(function(res){var t=db.transaction("blobs","readwrite");t.objectStore("blobs").delete(id);t.oncomplete=res;t.onerror=res;});
  }
  function allBlobs(){
    return new Promise(function(res){
      var m={},k;for(k in memBlobs)m[k]=memBlobs[k];
      if(!db){res(m);return;}
      var q=db.transaction("blobs").objectStore("blobs").getAll();
      q.onsuccess=function(){(q.result||[]).forEach(function(r){m[r.id]=r.blob;});res(m);};
      q.onerror=function(){res(m);};
    });
  }
  function all(store){
    if(store==="notes")return Promise.resolve(lsList(NP));
    var list=lsList(FP);
    return allBlobs().then(function(m){list.forEach(function(f){f.blob=m[f.id]||null;});return list;});
  }
  function put(store,rec){
    var id=newId();
    if(store==="notes"){
      try{lsSet(NP+id,{chapter:rec.chapter,text:rec.text,ts:rec.ts});}catch(e){return Promise.reject(e);}
      rec.id=id;return Promise.resolve(rec);
    }
    return putBlob(id,rec.blob).then(function(){
      lsSet(FP+id,{chapter:rec.chapter,name:rec.name,type:rec.type,size:rec.size,ts:rec.ts});
      rec.id=id;
      if(window.CAT&&CAT.files)CAT.files.queueUpload(id);
      return rec;
    });
  }
  function remove(store,id){
    if(store==="notes"){try{localStorage.removeItem(NP+id);}catch(e){}return Promise.resolve();}
    try{localStorage.removeItem(FP+id);}catch(e){}
    if(window.CAT&&CAT.files)CAT.files.remove(id);
    return delBlob(id);
  }
  /* Entries saved by the older version (stored only in this browser's IndexedDB) are moved over once. */
  function migrateOld(){
    if(!db||!db.objectStoreNames.contains("notes"))return Promise.resolve();
    function getAll(st){return new Promise(function(res){var q=db.transaction(st).objectStore(st).getAll();q.onsuccess=function(){res(q.result||[]);};q.onerror=function(){res([]);};});}
    return Promise.all([getAll("notes"),getAll("files")]).then(function(r){
      var ns=r[0],fl=r[1];if(!ns.length&&!fl.length)return;
      ns.forEach(function(n){lsSet(NP+newId(),{chapter:n.chapter,text:n.text,ts:n.ts});});
      var chain=Promise.resolve();
      fl.forEach(function(f){chain=chain.then(function(){var id=newId();
        return putBlob(id,f.blob).then(function(){lsSet(FP+id,{chapter:f.chapter,name:f.name,type:f.type,size:f.size,ts:f.ts});
          if(window.CAT&&CAT.files)CAT.files.queueUpload(id);});});});
      return chain.then(function(){return new Promise(function(res){
        var t=db.transaction(["notes","files"],"readwrite");t.objectStore("notes").clear();t.objectStore("files").clear();t.oncomplete=res;t.onerror=res;});});
    }).catch(function(){});
  }
  /* Files added on another device: download them when this device is online. */
  var fetching=false,failedDl={};
  function fetchMissing(){
    if(fetching||!window.CAT||!CAT.files||!navigator.onLine)return;
    var todo=files.filter(function(f){return !f.blob&&!failedDl[f.id];});
    if(!todo.length)return;
    fetching=true;
    var chain=Promise.resolve();
    todo.forEach(function(f){chain=chain.then(function(){
      return CAT.files.download(f.id).then(function(b){return putBlob(f.id,new Blob([b],{type:f.type||b.type}));},function(){failedDl[f.id]=1;});});});
    chain.then(function(){fetching=false;return refresh();});
  }

  var notes=[],files=[],urls={};
  function byChapter(arr,cid){return arr.filter(function(r){return r.chapter===cid;}).sort(function(a,b){return b.ts-a.ts;});}
  function urlFor(f){if(!f.blob)return "";if(!urls[f.id])urls[f.id]=URL.createObjectURL(f.blob);return urls[f.id];}

  /* ---------- rendering ---------- */
  var openAll=false;
  function openState(){ // remember which details are open across re-renders
    var s={};Array.prototype.forEach.call(list.querySelectorAll("details[data-k]"),function(d){if(d.open)s[d.getAttribute("data-k")]=1;});return s;
  }
  function chapterBody(cid){
    var ns=byChapter(notes,cid),fs=byChapter(files,cid),h="";
    h+='<div class="cbody" data-cid="'+cid+'">';
    h+='<textarea placeholder="What went wrong? e.g. forgot to adjust closing stock, mixed up the rate of discount..." aria-label="Error statement"></textarea>';
    h+='<div class="row"><button type="button" class="btn pri" data-act="add">Add statement</button>';
    h+='<label class="btn">Upload files<input type="file" multiple data-act="upload"></label></div>';
    if(ns.length){
      h+='<div class="sec">Statements</div><div class="items">';
      ns.forEach(function(n){h+='<div class="item"><div class="meta"><span>'+fmtDate(n.ts)+'</span><button class="del" type="button" data-act="delnote" data-id="'+n.id+'">Delete</button></div><div class="txt">'+esc(n.text)+'</div></div>';});
      h+='</div>';
    }
    if(fs.length){
      h+='<div class="sec">Files</div><div class="items">';
      fs.forEach(function(f){
        var u=urlFor(f),isImg=!!u&&(f.type||"").indexOf("image/")===0;
        h+='<div class="item"><div class="meta"><span>'+fmtDate(f.ts)+' · '+fmtSize(f.size)+'</span><button class="del" type="button" data-act="delfile" data-id="'+f.id+'">Delete</button></div><div class="file">'+
          (isImg?'<a href="'+u+'" target="_blank" rel="noopener"><img src="'+u+'" alt=""></a>':'<div class="ficon">📄</div>')+
          '<div class="fi">'+(u?'<a href="'+u+'" target="_blank" rel="noopener" download="'+esc(f.name)+'">'+esc(f.name)+'</a>':esc(f.name)+' <span style="color:var(--muted)">· waiting to download (needs internet)</span>')+'</div></div></div>';
      });
      h+='</div>';
    }
    if(!ns.length&&!fs.length)h+='<div class="none">No error logs for this chapter yet.</div>';
    return h+'</div>';
  }
  function render(keep){
    var q=qEl.value.trim().toLowerCase(),html="",shown=0,counter,st=keep||{};
    var totalN=notes.length,totalF=files.length;
    PAPERS.forEach(function(p){
      counter=0;var body="",matches=0,logs=0;
      p.parts.forEach(function(pt){
        var partHtml="",pm=0;
        pt.chapters.forEach(function(name){
          counter++;var cid="p"+p.n+"c"+counter;
          var cnt=byChapter(notes,cid).length+byChapter(files,cid).length;logs+=cnt;
          if(q&&name.toLowerCase().indexOf(q)===-1)return;
          pm++;
          var op=(q||openAll||st[cid])?" open":"";
          partHtml+='<details class="ch" data-k="'+cid+'"'+op+'><summary><span class="cn">'+counter+'</span><span class="ct">'+hl(name,q)+'</span><span class="badge'+(cnt?" has":"")+'">'+(cnt?cnt+(cnt===1?" log":" logs"):"No logs")+'</span></summary>'+chapterBody(cid)+'</details>';
        });
        if(pm){matches+=pm;if(pt.title)body+='<div class="part">'+esc(pt.title)+'</div>';body+=partHtml;}
      });
      if(q&&!matches)return;
      shown+=matches;
      var pk="paper"+p.n,po=(q||openAll||st[pk])?" open":"";
      html+='<details class="paper" data-k="'+pk+'" style="--pc:'+p.color+'"'+po+'><summary><span class="num">'+p.n+'</span><span class="ptitle"><b>'+esc(p.name)+'</b><span>'+counter+' chapters</span></span><span class="pcount">'+(logs?logs+(logs===1?" log":" logs"):"")+'</span><span class="chev">&#9656;</span></summary><div class="pbody">'+body+'</div></details>';
    });
    list.innerHTML=html;empty.style.display=(q&&!shown)?"block":"none";
    document.getElementById("sNotes").textContent=totalN;document.getElementById("sFiles").textContent=totalF;
  }
  function refresh(){return Promise.all([all("notes"),all("files")]).then(function(r){notes=r[0];files=r[1];render(openState());fetchMissing();});}

  /* ---------- events (delegated) ---------- */
  list.addEventListener("click",function(e){
    var b=e.target.closest("[data-act]");if(!b)return;
    var box=b.closest("[data-cid]");if(!box)return;
    var cid=box.getAttribute("data-cid"),act=b.getAttribute("data-act");
    if(act==="add"){
      var ta=box.querySelector("textarea"),t=ta.value.trim();if(!t){ta.focus();return;}
      put("notes",{chapter:cid,text:t,ts:Date.now()}).then(refresh);
    }else if(act==="delnote"){
      if(confirm("Delete this statement?"))remove("notes",b.getAttribute("data-id")).then(refresh);
    }else if(act==="delfile"){
      if(confirm("Delete this file?")){var id=b.getAttribute("data-id");if(urls[id]){URL.revokeObjectURL(urls[id]);delete urls[id];}remove("files",id).then(refresh);}
    }
  });
  list.addEventListener("change",function(e){
    var inp=e.target;if(inp.getAttribute("data-act")!=="upload")return;
    var cid=inp.closest("[data-cid]").getAttribute("data-cid"),fl=Array.prototype.slice.call(inp.files);if(!fl.length)return;
    Promise.all(fl.map(function(f,i){return put("files",{chapter:cid,name:f.name,type:f.type,size:f.size,blob:f,ts:Date.now()+i});}))
      .then(refresh).catch(function(){alert("Couldn't save a file. Your device storage may be full.");});
  });
  qEl.addEventListener("input",function(){render(openState());});
  toggle.addEventListener("click",function(){
    openAll=!openAll;toggle.textContent=openAll?"Collapse all":"Expand all";
    Array.prototype.forEach.call(list.querySelectorAll("details"),function(d){d.open=openAll;});
  });

  document.addEventListener("cat:synced",function(){refresh();});   // another device changed something
  window.addEventListener("online",function(){failedDl={};fetchMissing();});
  openDb().then(function(d){
    db=d;if(!db)warn.style.display="block";
    if(navigator.storage&&navigator.storage.persist){try{navigator.storage.persist();}catch(e){}}
    return migrateOld();
  }).then(refresh);
})();
</script>
<script src="js/core.js"></script>
</body>
</html>
